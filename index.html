<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUSIC</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#fff;
  --text:#111;
  --secondary:#777;
  --line:#e7e7e7;
  --accent:#fa2439;
  --card:#f3f3f5;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
               "SF Pro Text",Inter,Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
  border:0;
  background:none;
  color:inherit;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:145px;
}

/* HEADER */

.header{
  padding:22px 20px 8px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:27px;
  font-weight:750;
  letter-spacing:-1.2px;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* CONTENT */

.content{
  padding:0 20px;
}

.greeting{
  margin-top:20px;
  font-size:31px;
  line-height:1.05;
  font-weight:750;
  letter-spacing:-1.4px;
}

.section{
  margin-top:30px;
}

.section-title{
  font-size:21px;
  font-weight:720;
  margin-bottom:14px;
  letter-spacing:-.5px;
}

/* ALBUMS */

.album-scroll{
  display:flex;
  gap:16px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-right:-20px;
  padding-right:20px;
}

.album-scroll::-webkit-scrollbar{
  display:none;
}

.album{
  min-width:145px;
}

.cover{
  width:145px;
  height:145px;
  border-radius:13px;
  background:
    linear-gradient(135deg,#111,#555);
  box-shadow:0 7px 20px rgba(0,0,0,.14);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:38px;
  overflow:hidden;
}

.album-name{
  margin-top:9px;
  font-weight:650;
  font-size:15px;
}

.album-artist{
  color:var(--secondary);
  font-size:13px;
  margin-top:3px;
}

/* TRACKS */

.track{
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px 0;
}

.track-cover{
  width:54px;
  height:54px;
  border-radius:8px;
  background:linear-gradient(135deg,#222,#777);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  flex:none;
}

.track-info{
  min-width:0;
  flex:1;
}

.track-title{
  font-size:16px;
  font-weight:620;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.track-artist{
  margin-top:3px;
  font-size:13px;
  color:var(--secondary);
}

.play-small{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#f0f0f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

/* SEARCH */

.search-screen{
  display:none;
}

.search-box{
  margin-top:20px;
  height:50px;
  background:#eeeef0;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
}

.search-box span{
  color:#777;
}

.search-box input{
  border:0;
  outline:0;
  background:transparent;
  flex:1;
  font-size:16px;
  color:#111;
}

/* LIBRARY */

.library-screen{
  display:none;
}

.library-list{
  margin-top:20px;
}

.library-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.library-icon{
  width:46px;
  height:46px;
  border-radius:11px;
  background:#f0f0f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.library-text{
  font-weight:650;
}

/* MINI PLAYER */

.mini-player{
  position:fixed;
  left:12px;
  right:12px;
  bottom:78px;
  max-width:676px;
  margin:auto;
  height:62px;
  border-radius:14px;
  background:rgba(245,245,247,.94);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  box-shadow:0 4px 25px rgba(0,0,0,.12);
  display:flex;
  align-items:center;
  padding:7px 10px;
  gap:11px;
  z-index:20;
}

.mini-cover{
  width:48px;
  height:48px;
  border-radius:8px;
  background:linear-gradient(135deg,#222,#777);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.mini-info{
  flex:1;
  min-width:0;
}

.mini-title{
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-artist{
  font-size:12px;
  color:#777;
  margin-top:2px;
}

.mini-play{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

/* BOTTOM NAV */

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-top:1px solid rgba(0,0,0,.07);
  display:flex;
  justify-content:center;
  z-index:30;
}

.nav-inner{
  width:100%;
  max-width:700px;
  display:flex;
  justify-content:space-around;
}

.nav-button{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#777;
  font-size:11px;
}

.nav-button.active{
  color:var(--accent);
}

.nav-icon{
  font-size:22px;
}

/* PLAYER */

.player{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:100;
  padding:20px;
}

.player-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-player{
  font-size:25px;
}

.big-cover{
  width:min(82vw,420px);
  aspect-ratio:1;
  margin:55px auto 35px;
  border-radius:18px;
  background:linear-gradient(135deg,#111,#666);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:70px;
  box-shadow:0 20px 50px rgba(0,0,0,.18);
}

.big-title{
  font-size:26px;
  font-weight:750;
}

.big-artist{
  margin-top:5px;
  color:#777;
}

.progress{
  margin-top:30px;
}

.progress-line{
  height:4px;
  background:#ddd;
  border-radius:10px;
}

.progress-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#111;
  position:relative;
  top:-6px;
}

.times{
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:12px;
  margin-top:6px;
}

.controls{
  margin-top:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:32px;
}

.control{
  font-size:28px;
}

.control-main{
  width:66px;
  height:66px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

/* DARK MODE */

@media(prefers-color-scheme:dark){

  :root{
    --bg:#000;
    --text:#fff;
    --secondary:#999;
    --line:#292929;
    --card:#1c1c1e;
  }

  body{
    background:#000;
  }

  .profile,
  .play-small,
  .search-box,
  .library-icon{
    background:#1c1c1e;
  }

  .mini-player{
    background:rgba(30,30,32,.94);
  }

  .nav{
    background:rgba(0,0,0,.92);
    border-color:#222;
  }

  .player{
    background:#000;
  }

  .control-main{
    background:#fff;
    color:#000;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="header-top">
      <div class="logo">Music</div>
      <div class="profile">👤</div>
    </div>
  </div>

  <main class="content">

    <!-- HOME -->

    <section id="homeScreen">

      <div class="greeting">
        Добрый вечер
      </div>

      <div class="section">
        <div class="section-title">Для вас</div>

        <div class="album-scroll">

          <div class="album">
            <div class="cover">🎵</div>
            <div class="album-name">Избранное</div>
            <div class="album-artist">Для вас</div>
          </div>

          <div class="album">
            <div class="cover">🎧</div>
            <div class="album-name">Популярное</div>
            <div class="album-artist">Сегодня</div>
          </div>

          <div class="album">
            <div class="cover">✨</div>
            <div class="album-name">Новинки</div>
            <div class="album-artist">Музыка</div>
          </div>

        </div>
      </div>

      <div class="section">
        <div class="section-title">Недавно слушали</div>

        <div class="track" onclick="playTrack('After Dark','Mr.Kitty')">
          <div class="track-cover">🎵</div>
          <div class="track-info">
            <div class="track-title">After Dark</div>
            <div class="track-artist">Mr.Kitty</div>
          </div>
          <button class="play-small">▶</button>
        </div>

        <div class="track" onclick="playTrack('The Weeknd','Blinding Lights')">
          <div class="track-cover">🎵</div>
          <div class="track-info">
            <div class="track-title">Blinding Lights</div>
            <div class="track-artist">The Weeknd</div>
          </div>
          <button class="play-small">▶</button>
        </div>

      </div>

    </section>

    <!-- SEARCH -->

    <section id="searchScreen" class="search-screen">

      <div class="greeting">
        Поиск
      </div>

      <div class="search-box">
        <span>🔍</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Артисты, песни, альбомы"
          oninput="searchMusic()"
        >
      </div>

      <div id="searchResults" class="section"></div>

    </section>

    <!-- LIBRARY -->

    <section id="libraryScreen" class="library-screen">

      <div class="greeting">
        Медиатека
      </div>

      <div class="library-list">

        <div class="library-item">
          <div class="library-icon">❤️</div>
          <div class="library-text">Любимые</div>
        </div>

        <div class="library-item">
          <div class="library-icon">📝</div>
          <div class="library-text">Плейлисты</div>
        </div>

        <div class="library-item">
          <div class="library-icon">🎵</div>
          <div class="library-text">Песни</div>
        </div>

        <div class="library-item">
          <div class="library-icon">📀</div>
          <div class="library-text">Альбомы</div>
        </div>

        <div class="library-item">
          <div class="library-icon">👤</div>
          <div class="library-text">Исполнители</div>
        </div>

      </div>

    </section>

  </main>

</div>

<!-- MINI PLAYER -->

<div
  id="miniPlayer"
  class="mini-player"
  onclick="openPlayer()"
  style="display:none;"
>

  <div class="mini-cover">🎵</div>

  <div class="mini-info">
    <div id="miniTitle" class="mini-title">Track</div>
    <div id="miniArtist" class="mini-artist">Artist</div>
  </div>

  <button
    class="mini-play"
    onclick="event.stopPropagation(); togglePlay();"
  >
    ▶
  </button>

</div>

<!-- FULL PLAYER -->

<div id="player" class="player">

  <div class="player-top">
    <button
      class="close-player"
      onclick="closePlayer()"
    >
      ˅
    </button>

    <strong>Сейчас играет</strong>

    <span></span>
  </div>

  <div class="big-cover">
    🎵
  </div>

  <div class="big-title" id="bigTitle">
    Track
  </div>

  <div class="big-artist" id="bigArtist">
    Artist
  </div>

  <div class="progress">

    <div class="progress-line">
      <div class="progress-dot"></div>
    </div>

    <div class="times">
      <span>0:00</span>
      <span>3:42</span>
    </div>

  </div>

  <div class="controls">

    <button class="control">↶</button>

    <button class="control">◀</button>

    <button
      id="mainPlay"
      class="control-main"
      onclick="togglePlay()"
    >
      ▶
    </button>

    <button class="control">▶</button>

    <button class="control">↷</button>

  </div>

</div>

<!-- NAV -->

<nav class="nav">

  <div class="nav-inner">

    <button
      class="nav-button active"
      onclick="showScreen('home')"
    >
      <span class="nav-icon">⌂</span>
      Главная
    </button>

    <button
      class="nav-button"
      onclick="showScreen('search')"
    >
      <span class="nav-icon">⌕</span>
      Поиск
    </button>

    <button
      class="nav-button"
      onclick="showScreen('library')"
    >
      <span class="nav-icon">▣</span>
      Медиатека
    </button>

  </div>

</nav>

<script>

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}

let isPlaying = false;

function showScreen(screen){

  const home = document.getElementById("homeScreen");
  const search = document.getElementById("searchScreen");
  const library = document.getElementById("libraryScreen");

  home.style.display = "none";
  search.style.display = "none";
  library.style.display = "none";

  const buttons = document.querySelectorAll(".nav-button");
  buttons.forEach(b => b.classList.remove("active"));

  if(screen === "home"){
    home.style.display = "block";
    buttons[0].classList.add("active");
  }

  if(screen === "search"){
    search.style.display = "block";
    buttons[1].classList.add("active");

    setTimeout(()=>{
      document.getElementById("searchInput")?.focus();
    },100);
  }

  if(screen === "library"){
    library.style.display = "block";
    buttons[2].classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function playTrack(title,artist){

  document.getElementById("miniTitle").textContent = title;
  document.getElementById("miniArtist").textContent = artist;

  document.getElementById("miniPlayer").style.display = "flex";

  document.getElementById("bigTitle").textContent = title;
  document.getElementById("bigArtist").textContent = artist;

  isPlaying = true;

  document.getElementById("mainPlay").textContent = "Ⅱ";
}

function openPlayer(){
  document.getElementById("player").style.display = "block";
}

function closePlayer(){
  document.getElementById("player").style.display = "none";
}

function togglePlay(){

  isPlaying = !isPlaying;

  const symbol = isPlaying ? "Ⅱ" : "▶";

  document.getElementById("mainPlay").textContent = symbol;

}

function searchMusic(){

  const query =
    document.getElementById("searchInput").value
      .toLowerCase()
      .trim();

  const results =
    document.getElementById("searchResults");

  if(!query){

    results.innerHTML = `
      <div class="section-title">
        Популярное
      </div>
    `;

    return;
  }

  const tracks = [
    ["After Dark","Mr.Kitty"],
    ["Blinding Lights","The Weeknd"],
    ["Starboy","The Weeknd"],
    ["Believer","Imagine Dragons"],
    ["Sweater Weather","The Neighbourhood"]
  ];

  const found = tracks.filter(track =>
    track[0].toLowerCase().includes(query) ||
    track[1].toLowerCase().includes(query)
  );

  results.innerHTML = `
    <div class="section-title">
      Результаты
    </div>
  `;

  found.forEach(track => {

    results.innerHTML += `
      <div class="track"
        onclick="playTrack('${track[0]}','${track[1]}')">

        <div class="track-cover">🎵</div>

        <div class="track-info">
          <div class="track-title">
            ${track[0]}
          </div>

          <div class="track-artist">
            ${track[1]}
          </div>
        </div>

        <button class="play-small">
          ▶
        </button>

      </div>
    `;

  });

  if(!found.length){

    results.innerHTML += `
      <div style="color:#777;margin-top:20px;">
        Ничего не найдено
      </div>
    `;

  }

}

</script>

</body>
  </html>
